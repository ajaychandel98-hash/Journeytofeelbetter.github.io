<script>
const app=document.getElementById('app');
const places=[
{id:'shiva',name:'With Shiva',label:'A moment of stillness',symbol:'ॐ',title:'Let the world be quiet for a moment.',text:'There is no need to find the perfect words here. Sit for a little while, breathe gently, and let this moment belong to you.',message:'May you feel held, wherever you are.',action:'Take a quiet breath'},
{id:'sunset',name:'Chase the sunset',label:'A sky worth slowing down for',title:'The sky has saved a little colour for you.',text:'You do not have to make something of every moment. Sometimes, watching the light change is enough.',message:'You deserve beautiful moments, even on ordinary days.',action:'Catch a little golden light'},
{id:'dogs',name:'Meet a friend',label:'Four paws. So much love.',title:'Oh! My favourite human is here! 🐾',text:'No need to explain your day, hooman. I am here for company, flower deliveries, and belly rubs. Especially belly rubs.',message:'A flower for you, Sagrika! 🌼 I picked it myself. Well… someone helped. Come sit with me. You bring the belly rubs; I will bring the happy tail wags.',action:'Give your greeter a belly rub 🐾'},
{id:'waterfall',name:'Follow the water',label:'Let your thoughts wander',title:'Stay beside the water for a while.',text:'Imagine the cool mist on your face and the steady rush of water. Nothing needs an answer right now.',message:'It is all right to pause. You do not have to carry everything at once.',action:'Let one thought float away'},

function home(){resetMusicView();stopSceneMedia();document.body.classList.remove('visiting');current=-1;app.innerHTML='<section class="home"><div class="intro"><div class="eyebrow">A small gift. Just because.</div><h1>A little light,<br>just <em>for you.</em></h1><p>I don’t know how you are feeling at this moment. I just wanted to make you something that might bring a little happiness to your day.</p><p>A few things you love.<br>A few reminders that you are loved.</p><button class="primary" id="enter">Meet your little guide <span>↗</span></button><p class="note">No right answers. No pressure to feel a certain way.</p></div><div class="hero-image"><div class="welcome-symbol" aria-hidden="true">♡</div><div class="stamp">made with<br>a little love</div><div class="image-caption">Somewhere to breathe.<br>Something to make you smile.</div></div></section>';document.getElementById('enter').onclick=startJourney;move()}
function flower(){resetMusicView();stopSceneMedia();document.body.classList.remove('visiting');app.innerHTML='<section class="stage center"><div class="eyebrow">First, a little something</div><div class="flower" aria-label="A flower for you">🌷</div><h2>You deserve a flower.<br>Just for being you.</h2><p class="sub">No special occasion needed. I’m glad you’re here.</p><button class="primary" id="explore">Let’s find a lovely moment <span>↗</span></button></section>';document.getElementById('explore').onclick=startJourney;move()}

function startJourney(){mantraSession=false;pendingNamami=false;journeyLevel=0;journeyUnlocked=0;journeyDone=false;visited.clear();goLevel(0)}
function goLevel(level){if(level<0||level>=journey.length||level>journeyUnlocked)return;if(level!==5&&mantraSession){mantraSession=false;pendingNamami=false;if(musicReady&&activeSong===songs.shiva[0].id)musicPlayer.pauseVideo()}journeyLevel=level;const i=places.findIndex(p=>p.id===journey[level].id);scene(i)}
function advanceJourney(){if(journeyLevel===journey.length-1){journeyDone=true;ending();return;}journeyUnlocked=Math.max(journeyUnlocked,journeyLevel+1);goLevel(journeyLevel+1)}
function guideHtml(){return '<div class="journey-guide"><span aria-hidden="true">🐾</span><div><small>A word from your little guide</small><p>'+journey[journeyLevel].guide+'</p></div></div>'}
function wireJourney(i){const level=journey.findIndex(j=>j.id===places[i].id);if(level<0)return;journeyLevel=level;document.getElementById('next').textContent=journey[level].next;document.getElementById('next').onclick=advanceJourney;document.getElementById('back').textContent=level===0?'← Welcome':'← Previous stop';document.getElementById('back').onclick=()=>level===0?home():goLevel(level-1);document.getElementById('choose').textContent='Your journey';document.getElementById('choose').onclick=garden;document.getElementById('journeyMusic').onclick=()=>openMusic();document.getElementById('journeyBadge').textContent='LEVEL '+(level+1)+' / '+journey.length+' · '+journey[level].name}
function garden(){resetMusicView();stopSceneMedia();document.body.classList.remove('visiting');current=-1;app.innerHTML='<section class="stage journey-map"><div class="center"><div class="eyebrow">Your little adventure</div><h2>A path back to yourself.</h2><p class="sub">Ten lovely stops, one enthusiastic guide. Each moment leads to the next.</p><button class="primary" id="resumeJourney">'+(journeyDone?'Revisit the mountains':'Continue your journey')+' <span>→</span></button></div><div class="journey-path">'+journey.map((j,l)=>{const p=places.find(p=>p.id===j.id),locked=l>journeyUnlocked;return '<button class="path-stop '+(locked?'locked':'')+'" data-level="'+l+'" '+(locked?'disabled':'')+'><span class="path-number">'+(l<journeyUnlocked||journeyDone?'✓':String(l+1).padStart(2,'0'))+'</span><span class="path-symbol" aria-hidden="true">'+placeSymbol(p.id)+'</span><span class="path-copy"><strong>'+j.name+'</strong><small>'+(locked?'Waiting further down the path':l<journeyUnlocked||journeyDone?'A lovely moment you can revisit':'Your next lovely moment')+'</small></span><span aria-hidden="true">'+(locked?'·':'→')+'</span></button>'}).join('')+'</div><button class="journey-music-tile" id="musicTile">♫ &nbsp; Music <small>Shiva mantras &amp; Pahari songs for the way</small></button></section>';app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>goLevel(Number(b.dataset.level)));document.getElementById('resumeJourney').onclick=()=>goLevel(Math.min(journeyLevel,journeyUnlocked));document.getElementById('musicTile').onclick=musicPage;move()}

function scene(i,shivaCategory){stopSceneMedia();if(i===0&&!shivaCategory){shivaMenu();return;}resetMusicView();current=i;visited.add(i);const p=places[i];journeyLevel=journey.findIndex(j=>j.id===p.id);document.body.classList.add('visiting');app.innerHTML='<section class="immersive-scene empty-scene empty-'+p.id+(chapterMedia[p.id]?' scene-has-video':'')+'" id="immersiveScene" aria-label="'+p.name+'">'+sceneMediaHtml(p.id)+'<div class="scene-shade"></div><div class="immersive-toolbar"><button id="back">← Previous stop</button><span id="journeyBadge"></span></div><button class="view-toggle" id="hideView" aria-pressed="false">Just the moment ♡</button><div class="immersive-bottom"><div class="eyebrow">'+(i===0?'Panch Kedar':p.label)+'</div><h2>'+p.title+'</h2><p class="immersive-message">'+p.message+'</p>'+guideHtml()+sceneMediaControls(p.id)+'<details class="scene-note"><summary>A little moment for you ♡</summary><div class="scene-note-content"><p>'+p.text+'</p>'+(p.id==='shiva'?'<div class="mantra">ॐ नमः शिवाय</div><button id="mantraMusic">♫ Choose a Shiva mantra</button>':(p.id==='mountains'||p.id==='festival')?'<button id="pahariMusic">♫ A Pahari song for the hills</button>':'')+'<div class="activity"><button id="action">'+p.action+'</button><div class="response" id="response" aria-live="polite"></div></div></details><div class="immersive-navigation"><button id="next"></button><button id="choose">Your journey</button><button id="journeyMusic">♫ Music</button></div></div></section>';wireJourney(i);mountSceneMedia(p.id);document.getElementById('action').onclick=()=>act(i);document.getElementById('hideView').onclick=function(){const hide=document.getElementById('immersiveScene').classList.toggle('view-only');this.setAttribute('aria-pressed',String(hide));this.textContent=hide?'Show controls ♡':'Just the moment ♡'};if(p.id==='shiva')document.getElementById('mantraMusic').onclick=()=>openMusic('shiva');if(p.id==='mountains'||p.id==='festival')document.getElementById('pahariMusic').onclick=()=>openMusic('pahari');move()}
function sceneMediaHtml(id){const clips=chapterMedia[id];if(!clips)return '<div class="empty-scene-symbol" aria-hidden="true">'+placeSymbol(id)+'</div>';return '<video id="sceneVideo" class="immersive-photo immersive-video" playsinline autoplay loop preload="auto" poster="'+clips[0].poster+'" aria-label="'+escapeHtml(clips[0].title)+'"></video>'}
function sceneMediaControls(id){const clips=chapterMedia[id];if(!clips)return '';return '<div class="compact-media-controls" aria-label="Video controls">'+(clips.length>1?'<button id="clipPrev" aria-label="Previous video">←</button><span id="clipCount"></span><button id="clipNext" aria-label="Next video">→</button>':'')+'<button id="clipPause" aria-label="Pause video">Pause Ⅱ</button><button id="clipSound" aria-label="Turn on video sound">Sound ♫</button><button id="clipFit">Fill screen ⤢</button></div><p class="video-status" id="videoStatus" role="status" aria-live="polite"></p><button id="retryVideo" class="retry-video" hidden>Retry this moment ↻</button><p class="clip-title" id="clipTitle"></p><small class="clip-credit" id="clipCredit"></small>'}
function mountSceneMedia(id){activeSceneClips=chapterMedia[id]||[];activeSceneClip=0;if(!activeSceneClips.length)return;const v=document.getElementById('sceneVideo');document.getElementById('clipPause').onclick=()=>{v.dataset.userPaused=String(!v.paused);if(v.paused)playVisibleVideo(v);else v.pause();updateMediaControls()};document.getElementById('clipSound').onclick=()=>{v.muted=!v.muted;if(!v.muted&&musicPlayer&&musicReady)musicPlayer.pauseVideo();updateMediaControls()};document.getElementById('clipFit').onclick=function(){const fill=document.getElementById('immersiveScene').classList.toggle('fill-media');this.textContent=fill?'Show whole video':'Fill screen ⤢'};if(activeSceneClips.length>1){document.getElementById('clipPrev').onclick=()=>changeSceneClip(-1);document.getElementById('clipNext').onclick=()=>changeSceneClip(1)}v.addEventListener('play',updateMediaControls);v.addEventListener('pause',updateMediaControls);document.getElementById('retryVideo').onclick=()=>retrySceneVideo(v);loadSceneClip();observeSceneVideos()}
function loadSceneClip(){const c=activeSceneClips[activeSceneClip],v=document.getElementById('sceneVideo');v.dataset.userPaused='false';v.dataset.retryCount='0';v.muted=mantraSession;if(!v.muted&&musicPlayer&&musicReady)musicPlayer.pauseVideo();v.preload='auto';v.poster=c.poster;v.setAttribute('aria-label',c.title);if(v.dataset.media!==c.video)loadBrowserVideo(v,c.video);document.getElementById('clipTitle').textContent=c.title;document.getElementById('clipCredit').textContent=c.credit;if(activeSceneClips.length>1)document.getElementById('clipCount').textContent=(activeSceneClip+1)+' / '+activeSceneClips.length;playVisibleVideo(v);updateMediaControls()}
function changeSceneClip(step){activeSceneClip=(activeSceneClip+step+activeSceneClips.length)%activeSceneClips.length;loadSceneClip()}
function updateMediaControls(){const v=document.getElementById('sceneVideo');if(!v)return;const pause=document.getElementById('clipPause'),sound=document.getElementById('clipSound');if(pause){pause.textContent=v.paused?'Resume ▷':'Pause Ⅱ';pause.setAttribute('aria-label',v.paused?'Resume video':'Pause video')}if(sound){sound.textContent=v.muted?'Sound ♫':'Mute ♫';sound.setAttribute('aria-label',v.muted?'Turn on video sound':'Mute video sound')}}
const embeddedVideoData=new Map(),embeddedVideoWaiters=new Map();
const embeddedVideoPaths=new Set(["media/shiva/hand.mp4", "media/dogs/flowers.mp4", "media/dogs/puppy.mp4", "media/waterfall/golden.mp4", "media/aurora/norway.mp4", "media/waterfall/flowers.mp4", "media/sky/flowers.mp4", "media/sky/mountains.mp4", "media/festival/celebration.mp4", "media/mountains/homecoming.mp4", "media/temples/kedarnath.mp4", "media/temples/tungnath.mp4", "media/temples/rudranath.mp4", "media/temples/madhyamaheshwar.mp4", "media/temples/kalpeshwar.mp4", "media/train/journey.mp4", "media/shimla/night.mp4"]);
function registerEmbeddedVideo(path,base64){embeddedVideoData.set(path,base64);const waiter=embeddedVideoWaiters.get(path);if(waiter){clearTimeout(waiter.timer);waiter.resolve(base64);embeddedVideoWaiters.delete(path)}}
function requestVideoPacket(path){if(embeddedVideoData.has(path))return Promise.resolve(embeddedVideoData.get(path));if(embeddedVideoWaiters.has(path))return embeddedVideoWaiters.get(path).promise;if(!embeddedVideoPaths.has(path))return Promise.reject(new Error('Unknown clip'));let resolve,reject;const promise=new Promise((yes,no)=>{resolve=yes;reject=no}),script=document.createElement('script');const waiter={promise,resolve,reject,script,timer:null};embeddedVideoWaiters.set(path,waiter);const fail=()=>{clearTimeout(waiter.timer);embeddedVideoWaiters.delete(path);script.remove();reject(new Error('Clip packet did not load'))};script.async=true;script.src=path.replace(/\.mp4$/,'.js');script.onerror=fail;waiter.timer=setTimeout(fail,60000);document.head.appendChild(script);return promise}
async function embeddedVideoBlob(path,signal){if(signal.aborted)throw new DOMException('Cancelled','AbortError');let abort;const cancelled=new Promise((_,reject)=>{abort=()=>reject(new DOMException('Cancelled','AbortError'));signal.addEventListener('abort',abort,{once:true})});let encoded;try{encoded=await Promise.race([requestVideoPacket(path),cancelled])}finally{signal.removeEventListener('abort',abort)}if(signal.aborted)throw new DOMException('Cancelled','AbortError');const raw=atob(encoded),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:'video/mp4'})}
const browserVideoCache=new Map();
async function loadBrowserVideo(video,path,force=false){if(!path||!video.isConnected)return;const generation=(video._loadGeneration||0)+1;video._loadGeneration=generation;if(video._download)video._download.abort();video.dataset.media=path;video.dataset.loadingBlob='true';video.pause();video.removeAttribute('src');video.load();videoStatus(video,'Loading this moment…');let objectUrl;try{if(force&&browserVideoCache.has(path)){URL.revokeObjectURL(browserVideoCache.get(path));browserVideoCache.delete(path)}if(browserVideoCache.has(path)){objectUrl=browserVideoCache.get(path);browserVideoCache.delete(path);browserVideoCache.set(path,objectUrl)}else{const controller=new AbortController();video._download=controller;const file=await embeddedVideoBlob(path,controller.signal);if(!video.isConnected||generation!==video._loadGeneration)return;objectUrl=URL.createObjectURL(new Blob([file],{type:'video/mp4'}));browserVideoCache.set(path,objectUrl);while(browserVideoCache.size>3){const [key,oldUrl]=browserVideoCache.entries().next().value;URL.revokeObjectURL(oldUrl);browserVideoCache.delete(key)}}if(!video.isConnected||generation!==video._loadGeneration)return;video._download=null;video.dataset.loadingBlob='false';video.src=objectUrl;video.load();playVisibleVideo(video)}catch(error){if(error.name==='AbortError'||!video.isConnected||generation!==video._loadGeneration)return;video._download=null;video.dataset.loadingBlob='false';videoStatus(video,'This moment could not download. Please try again.',true);updateMediaControls()}}
window.addEventListener('pagehide',()=>{app.querySelectorAll('video').forEach(v=>{v.pause();if(v._download)v._download.abort()});for(const url of browserVideoCache.values())URL.revokeObjectURL(url);browserVideoCache.clear()});
window.addEventListener('pageshow',event=>{if(event.persisted)app.querySelectorAll('video').forEach(v=>loadBrowserVideo(v,v.dataset.media||v.dataset.videoSrc))});
const visibleSceneVideos=new Set();
function videoStatus(video,message,failed=false){if(!video.isConnected)return;const hand=video.id==='shivaHandVideo';const status=document.getElementById(hand?'handVideoStatus':'videoStatus'),retry=document.getElementById(hand?'retryHandVideo':'retryVideo');if(status){status.textContent=message;status.hidden=!message}if(retry)retry.hidden=!failed}
function retrySceneVideo(video){if(!video.isConnected)return;if(video.src&&video.src.startsWith('blob:')&&video.readyState>=1){video.dataset.userPaused='false';video.muted=true;playVisibleVideo(video);return;}video.dataset.retryCount='0';video.dataset.userPaused='false';video.muted=true;loadBrowserVideo(video,video.dataset.media||video.dataset.videoSrc,true)}
function playVisibleVideo(video){if(document.hidden||!video.isConnected||video.dataset.userPaused==='true'||video.dataset.loadingBlob==='true'||!video.src)return;const source=video.currentSrc||video.src;const attempt=video.play();if(attempt&&attempt.catch)attempt.catch(error=>{if(!video.isConnected||video.dataset.userPaused==='true'||source!==(video.currentSrc||video.src))return;if(error.name==='AbortError')return;if(error.name==='NotAllowedError'&&!video.muted){video.muted=true;playVisibleVideo(video);return;}videoStatus(video,error.name==='NotAllowedError'?'Your browser paused this video. You can resume it.':'This moment could not start. Please try again.',true);updateMediaControls()})}
function bindVideoRecovery(video){video.addEventListener('loadstart',()=>videoStatus(video,'Loading this moment…'));video.addEventListener('waiting',()=>{if(video.dataset.userPaused!=='true')videoStatus(video,'Loading this moment…')});video.addEventListener('playing',()=>videoStatus(video,''));video.addEventListener('loadeddata',()=>{if(visibleSceneVideos.has(video))playVisibleVideo(video)});video.addEventListener('error',()=>{if(!video.isConnected||video.dataset.loadingBlob==='true')return;if((video.error?.code===2)&&Number(video.dataset.retryCount||0)<1){video.dataset.retryCount='1';videoStatus(video,'Trying this moment again…');setTimeout(()=>{if(video.isConnected&&video.dataset.userPaused!=='true'){loadBrowserVideo(video,video.dataset.media,true)}},800)}else{videoStatus(video,'This moment could not load. Try again in a little while.',true);updateMediaControls()}})}
const sceneVideoObserver=typeof IntersectionObserver==='function'?new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting&&e.intersectionRatio>=.45){visibleSceneVideos.add(e.target);playVisibleVideo(e.target)}else{visibleSceneVideos.delete(e.target);e.target.pause()}}},{threshold:[0,.45,1]}):null;
function observeSceneVideos(){for(const v of visibleSceneVideos){if(!v.isConnected){v.pause();visibleSceneVideos.delete(v);if(sceneVideoObserver)sceneVideoObserver.unobserve(v)}}app.querySelectorAll('video').forEach(v=>{if(v.dataset.autoplayReady)return;v.dataset.autoplayReady='true';bindVideoRecovery(v);v.muted=mantraSession;if(v.dataset.videoSrc&&!v.dataset.media)loadBrowserVideo(v,v.dataset.videoSrc);v.autoplay=true;v.playsInline=true;v.preload='auto';v.removeAttribute('muted');v.setAttribute('playsinline','');v.setAttribute('autoplay','');v.addEventListener('canplay',()=>{if(visibleSceneVideos.has(v))playVisibleVideo(v)});if(sceneVideoObserver)sceneVideoObserver.observe(v);else{visibleSceneVideos.add(v);playVisibleVideo(v)}})}

function stopSceneMedia(){app.querySelectorAll('video').forEach(v=>{v.pause();if(v._download)v._download.abort();v._loadGeneration=(v._loadGeneration||0)+1;if(sceneVideoObserver)sceneVideoObserver.unobserve(v);v.removeAttribute('src');v.dataset.media='';v.dataset.loadingBlob='false';v.load()});visibleSceneVideos.clear()}

function act(i){const r=document.getElementById('response');if(i===0){r.innerHTML='<div class="breathe">Breathe gently</div><span>Follow the circle, only if it feels comfortable.</span>'}else{const lines=['','A little warmth, saved just for you.','Belly rub received! You are now my favourite hooman. Please do not tell the others. 🐾','For this moment, let it rest beside the water.','May there be more moments that feel like home.','A little wish, sent out among the stars.','A little wonder, saved just for you.'];r.textContent=lines[i]||({train:'Window seat saved. Let the hills come to you.',shimla:'A familiar breath. You are a little closer to home.',festival:'A little rhythm, a little joy. Dance at your own pace.'}[places[i]?.id])||'A lovely little moment, just for you.';burst(i===2?'🐾':i===1?'✦':'♡')}}
function burst(mark){for(let j=0;j<10;j++){const el=document.createElement('span');el.className='petal';el.textContent=mark;el.style.left=(20+Math.random()*60)+'vw';el.style.top=(45+Math.random()*30)+'vh';el.style.color='#bd885b';document.body.append(el);setTimeout(()=>el.remove(),1800)}}
function ending(){journeyDone=true;resetMusicView();stopSceneMedia();document.body.classList.remove('visiting');current=-1;app.innerHTML='<section class="stage"><div class="end"><div class="eyebrow">Ten stops. A little closer to home.</div><div class="flower" aria-hidden="true">🌷</div><h2>You are loved,<br><em>exactly as you are.</em></h2><p>You don’t need to smile for anyone.<br>You don’t need to explain how you feel.<br>I just wanted you to know that you matter to me.</p><p>I hope this brought a little light to your day.<br>And if you’d like company, I’m here.</p><button class="primary" id="again">Revisit your journey <span>♡</span></button><p class="sub">Your little guide is curled up beside you. The mountains are quiet. You made it home.</p><button class="quiet" id="restartJourney">Take the adventure again →</button></div></section>';document.getElementById('restartJourney').onclick=startJourney;document.getElementById('again').onclick=garden;move()}
function renderSongs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('songList').innerHTML=songs[tab].map((s,i)=>'<button class="song '+(activeSong===s.id?'active':'')+'" '+(!musicReady?'disabled':'')+' data-song="'+i+'">▷ &nbsp; '+s.title+'<small>'+s.artist+'</small></button>').join('');document.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>playSong(songs[tab][Number(b.dataset.song)]))}
function musicStatus(message){document.getElementById('playerHint').textContent=message}
function initMusicPlayer(prepare=false){
  if(musicPlayer || !window.YT || !window.YT.Player || (!prepare&&document.getElementById('musicPanel').hidden))return;
  musicStatus('Preparing your music…');
  musicPlayer=new YT.Player('youtubePlayer',{
    host:'https://www.youtube-nocookie.com',width:'100%',height:'200',
    videoId:songs[tab][0].id,
    playerVars:{autoplay:0,playsinline:1,rel:0,origin:window.location.origin},
    events:{
      onReady:function(event){
        const frame=event.target.getIframe();
        frame.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');
        frame.setAttribute('title','Music player');
        frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        musicReady=true;renderSongs();musicStatus('Ready. Click any song to start listening.');if(pendingNamami){pendingNamami=false;playSong(songs.shiva[0])}
      },
      onStateChange:function(event){
        if(event.data===1){musicStatus('Playing. You can keep exploring while you listen.');document.getElementById('stopSong').hidden=false}
        else if(event.data===3)musicStatus('Loading your song…');
        else if(event.data===2 && activeSong)musicStatus('Paused. Click the selected song to resume.');
        else if(event.data===0)musicStatus('Song finished. Choose another whenever you like.');
      },
      onAutoplayBlocked:function(){musicStatus('Your browser blocked playback. Tap the selected song to retry; if it still blocks, use Play in the player.');},
      onError:function(){musicStatus('This recording could not play here. Please try another song.');}
    }
  });
  musicPlayer.getIframe().setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');
}
window.onYouTubeIframeAPIReady=()=>initMusicPlayer(journeyLevel===5);
const musicApi=document.createElement('script');musicApi.src='https://www.youtube.com/iframe_api';musicApi.onerror=function(){musicApiFailed=true;musicStatus('The music service could not load. Please refresh when your connection is available.');};document.head.appendChild(musicApi);
function beginNamami(){mantraSession=true;if(musicReady){playSong(songs.shiva[0])}else{pendingNamami=true;initMusicPlayer(true)}}
function playSong(s){
 app.querySelectorAll('video').forEach(v=>v.muted=true);updateMediaControls();
  if(!musicReady)return;

  if(!document.getElementById('musicPanel').hidden)document.getElementById('player').scrollIntoView({block:'nearest',behavior:'instant'});
  // Keep the loaded player and call playback directly within the song-click gesture.
  musicPlayer.unMute();musicPlayer.setVolume(80);
  if(activeSong===s.id && musicPlayer.getPlayerState()!==0){musicPlayer.playVideo()}
  else{activeSong=s.id;musicPlayer.loadVideoById({videoId:s.id,startSeconds:0});musicPlayer.playVideo()}
  document.getElementById('stopSong').hidden=false;renderSongs();
}
document.getElementById('stopSong').onclick=function(){
  if(musicPlayer && musicReady)musicPlayer.stopVideo();

  musicStatus('Music stopped. Click a song whenever you like.');renderSongs();
};
